name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is read from package.json's `packageManager` field so
        # CI and local stay in lockstep. Specifying `version:` here too
        # makes pnpm/action-setup error out with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        # postinstall builds @pinloom/shared so downstream packages typecheck.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # E2E intentionally NOT run in CI. Two recent runs hung on Playwright's
      # Chromium install/launch step (one 2h with `--with-deps`, one 5m
      # silent post-download), and pinloom is a local-only single-user dev
      # tool where the 176 backend unit tests + typecheck + build already
      # prove the boot path. The smoke spec stays in `e2e/` and `pnpm
      # test:e2e` still runs it locally / on demand.
