name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is read from package.json's `packageManager` field so
        # CI and local stay in lockstep. Specifying `version:` here too
        # makes pnpm/action-setup error out with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        # postinstall builds @pinloom/shared so downstream packages typecheck.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        # Drop `--with-deps`: the ubuntu-latest runner already ships every
        # system library Playwright's Chromium needs, and the `apt-get`
        # path that flag triggers has hung indefinitely on a healthy job
        # at least once. Cap the step so the next infra hiccup fails fast
        # instead of burning a 6-hour runner timeout.
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: E2E
        timeout-minutes: 10
        run: pnpm test:e2e
