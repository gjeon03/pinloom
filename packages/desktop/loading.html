<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1b26;
        color: #c0caf5;
        font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #7aa2f7;
        animation: pulse 1.1s ease-in-out infinite;
      }
      .name {
        font-size: 15px;
        letter-spacing: 0.06em;
        color: #7aa2f7;
        font-weight: 600;
      }
      .sub {
        font-size: 12px;
        color: #565f89;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <div class="name">pinloom</div>
      <div class="sub">connecting to your local workspace…</div>
    </div>
  </body>
</html>
